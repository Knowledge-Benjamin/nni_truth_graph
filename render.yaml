services:
  # ─── UNIFIED WEB SERVICE (Express serves React + API) ────────────────────────
  # The Express backend now serves the compiled React frontend AND handles SEO
  # metadata injection for deep-linked /entity/:slug and /claim/:id routes.
  - type: web
    name: nni-truth-graph
    env: node
    rootDir: .
    buildCommand: npm install --prefix client && npm run build --prefix client && npm install --prefix server
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      # API points to the same origin — no cross-origin needed
      - key: VITE_API_URL
        value: ""
      - key: NODE_ENV
        value: production
      # Required secrets — add these securely in Render's web dashboard
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
