name: Deploy CC Proxy to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ACCOUNT: ${{ secrets.HF_ACCOUNT }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          HF_ACCOUNT="${{ secrets.HF_ACCOUNT }}"
          HF_SPACE_NAME="${{ secrets.HF_SPACE_NAME }}"
          if [ -z "$HF_ACCOUNT" ]; then
            echo "HF_ACCOUNT is not set, falling back to bravadoben"
            HF_ACCOUNT="bravadoben"
          fi
          if [ -z "$HF_SPACE_NAME" ]; then
            echo "HF_SPACE_NAME is not set, falling back to cc-proxy"
            HF_SPACE_NAME="cc-proxy"
          fi
          git remote add hf https://$HF_ACCOUNT:$HF_TOKEN@huggingface.co/spaces/$HF_ACCOUNT/$HF_SPACE_NAME
          git push hf main --force
